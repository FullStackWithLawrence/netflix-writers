version: 2
updates:
  - package-ecosystem: "python"
    directory: "/"
    labels:
      - "dependencies"
      - "python"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
  - package-ecosystem: "npm"
    directory: "/"
    labels:
      - "dependencies"
      - "javascript"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
  - package-ecosystem: "github-actions"
    directory: "/.github"
    labels:
      - "dependencies"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
